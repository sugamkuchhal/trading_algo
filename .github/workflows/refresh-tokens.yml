name: refresh-tokens

on:
  schedule:
    - cron: "0 19 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      REPO: sugamkuchhal/trading_algo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python dependencies (selenium + extras)
        run: |
          python -m pip install --upgrade pip
          pip install selenium pyotp webdriver-manager kiteconnect

      # -------------------- SARAS flow ------------------

      - name: Preload SARAS token
        run: |
          mkdir -p ~/.config/trading_algo
          echo '{"access_token":"'"${{ secrets.ACCESS_TOKEN_SARAS }}"'"}' \
            > ~/.config/trading_algo/access_token_saras.json
          chmod 600 ~/.config/trading_algo/access_token_saras.json

      - name: Refresh SARAS access token
        env:
          ACCESS_JSON_SARAS: ${{ secrets.ACCESS_JSON_SARAS }}
          ACCESS_TOKEN_GH_PAT_SARAS: ${{ secrets.ACCESS_TOKEN_GH_PAT_SARAS }}
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN_GH_PAT_SARAS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CHROME_BIN: /usr/bin/google-chrome-stable
        run: |
          python tools/auto_login.py --env saras

      # -------------------- VS flow ---------------------

      - name: Preload VS token
        run: |
          mkdir -p ~/.config/trading_algo
          echo '{"access_token":"'"${{ secrets.ACCESS_TOKEN_VS }}"'"}' \
            > ~/.config/trading_algo/access_token_vs.json
          chmod 600 ~/.config/trading_algo/access_token_vs.json

      - name: Refresh VS access token
        env:
          ACCESS_JSON_VS: ${{ secrets.ACCESS_JSON_VS }}
          ACCESS_TOKEN_GH_PAT_VS: ${{ secrets.ACCESS_TOKEN_GH_PAT_VS }}
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN_GH_PAT_VS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CHROME_BIN: /usr/bin/google-chrome-stable
        run: |
          python tools/auto_login.py --env vs

      # -------------------- UPDATE flow -----------------

      - name: Confirm secrets updated
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN_GH_PAT_SARAS }}
        run: |
          gh secret list -R $REPO | grep ACCESS_TOKEN_ || true
