name: refresh-tokens

on:
  schedule:
    # canonical refresh cron (UTC)
    - cron: "0 19 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      REPO: sugamkuchhal/trading_algo
      ALERT_TO: sugamkuchhal@gmail.com
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: sugamkuchhal@gmail.com
      SMTP_TOKEN_JSON_COMMON: ${{ secrets.SMTP_TOKEN_JSON_COMMON }}

      # SARAS creds
      ACCESS_TOKEN_GH_PAT_SARAS: ${{ secrets.ACCESS_TOKEN_GH_PAT_SARAS }}

      # VS creds
      ACCESS_TOKEN_GH_PAT_VS: ${{ secrets.ACCESS_TOKEN_GH_PAT_VS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Google Chrome (stable)
        uses: browser-actions/setup-chrome@v3
        with:
          chrome-version: stable

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # installed packages include selenium and webdriver-manager to reduce chromedriver mismatch issues
          pip install kiteconnect selenium pyotp webdriver-manager

      - name: Verify chrome & chromedriver
        run: |
          set -euo pipefail
          echo "Which chrome binary:"
          command -v google-chrome-stable || command -v google-chrome || true
          echo "Chrome version:"
          google-chrome-stable --version || google-chrome --version || true
          # chromedriver may come from package or webdriver-manager at runtime
          command -v chromedriver || true

      - name: Refresh SARAS access token
        env:
          ACCESS_JSON_SARAS: ${{ secrets.ACCESS_JSON_SARAS }}
          ACCESS_TOKEN_GH_PAT_SARAS: ${{ secrets.ACCESS_TOKEN_GH_PAT_SARAS }}
          # helpful override if some installs place chrome elsewhere (optional)
          GOOGLE_CHROME_BIN: /usr/bin/google-chrome-stable
        run: |
          set -euo pipefail
          python tools/auto_login.py --env saras

      - name: Refresh VS access token
        env:
          ACCESS_JSON_VS: ${{ secrets.ACCESS_JSON_VS }}
          ACCESS_TOKEN_GH_PAT_VS: ${{ secrets.ACCESS_TOKEN_GH_PAT_VS }}
          GOOGLE_CHROME_BIN: /usr/bin/google-chrome-stable
        run: |
          set -euo pipefail
          python tools/auto_login.py --env vs

      - name: Confirm secrets updated
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN_GH_PAT_SARAS }}
        run: |
          set -euo pipefail
          echo "🔎 Checking updated ACCESS_TOKEN_* secrets:"
          gh secret list -R $REPO | grep ACCESS_TOKEN_ || true
