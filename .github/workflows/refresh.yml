name: refresh

on:
  schedule:
    - cron: "0 19 * * 0-4"   # weekly Mon-Fri at 19:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-24.04

    env:
      REPO: sugamkuchhal/trading_algo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'    # use a supported version

      - name: Create config dir (CI preload location)
        run: |
          mkdir -p ~/.config/trading_algo

      # PRELOAD: write provided access token JSON into config (so validator can read it)
      # Expected secrets: ACCESS_TOKEN_<ENV> (raw JSON string for each env)
      - name: Preload SARAS token
        if: ${{ secrets.ACCESS_TOKEN_SARAS != '' }}
        run: |
          echo "${{ secrets.ACCESS_TOKEN_SARAS }}" > ~/.config/trading_algo/access_token_saras.json
          chmod 600 ~/.config/trading_algo/access_token_saras.json

      - name: Install minimal deps for validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Validate preloaded SARAS token
        id: validate_saras
        run: |
          if python tools/ci_validate_token.py --env saras; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

      - name: If SARAS invalid: install browser deps
        if: steps.validate_saras.outputs.valid == 'false'
        run: |
          # install only when login is required
          python -m pip install selenium pyotp webdriver-manager kiteconnect

      - name: If SARAS invalid: run auto-login
        if: steps.validate_saras.outputs.valid == 'false'
        run: |
          python tools/auto_login.py --env saras

      - name: Confirm/update secrets (SARAS)
        if: always()  # show what's currently present in GH Secrets (timestamps), helpful for logs
        run: |
          gh secret list -R $REPO | grep ACCESS_TOKEN_ || true

      # Repeat for VS environment (same flow)
      - name: Preload VS token
        if: ${{ secrets.ACCESS_TOKEN_VS != '' }}
        run: |
          echo "${{ secrets.ACCESS_TOKEN_VS }}" > ~/.config/trading_algo/access_token_vs.json
          chmod 600 ~/.config/trading_algo/access_token_vs.json

      - name: Validate preloaded VS token
        id: validate_vs
        run: |
          if python tools/ci_validate_token.py --env vs; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

      - name: If VS invalid: install browser deps
        if: steps.validate_vs.outputs.valid == 'false'
        run: |
          python -m pip install selenium pyotp webdriver-manager kiteconnect

      - name: If VS invalid: run auto-login
        if: steps.validate_vs.outputs.valid == 'false'
        run: |
          python tools/auto_login.py --env vs

      - name: Confirm secrets updated (final)
        run: |
          gh secret list -R $REPO | grep ACCESS_TOKEN_ || true

