name: refresh

on:
  schedule:
    - cron: "0 19 * * 0-4"   # weekly Mon-Fri at 19:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-24.04

    env:
      REPO: sugamkuchhal/trading_algo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'    # supported version

      - name: Create config dir (CI preload location)
        run: mkdir -p ~/.config/trading_algo

      - name: Preload SARAS token (if secret present)
        run: |
          if [ -n "${{ secrets.ACCESS_TOKEN_SARAS }}" ]; then
            echo "${{ secrets.ACCESS_TOKEN_SARAS }}" > ~/.config/trading_algo/access_token_saras.json
            chmod 600 ~/.config/trading_algo/access_token_saras.json
            echo "Preloaded ACCESS_TOKEN_SARAS"
          else
            echo "No ACCESS_TOKEN_SARAS secret; skipping preload"
          fi

      - name: Install minimal deps for validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Validate preloaded SARAS token
        id: validate_saras
        run: |
          if python tools/ci_validate_token.py --env saras; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

      - name: If SARAS invalid install browser deps
        if: steps.validate_saras.outputs.valid == 'false'
        run: |
          python -m pip install selenium pyotp webdriver-manager kiteconnect

      - name: If SARAS invalid run auto-login
        if: steps.validate_saras.outputs.valid == 'false'
        run: python tools/auto_login.py --env saras

      - name: Confirm secrets updated (SARAS)
        run: |
          gh secret list -R $REPO | grep ACCESS_TOKEN_ || true

      - name: Preload VS token (if secret present)
        run: |
          if [ -n "${{ secrets.ACCESS_TOKEN_VS }}" ]; then
            echo "${{ secrets.ACCESS_TOKEN_VS }}" > ~/.config/trading_algo/access_token_vs.json
            chmod 600 ~/.config/trading_algo/access_token_vs.json
            echo "Preloaded ACCESS_TOKEN_VS"
          else
            echo "No ACCESS_TOKEN_VS secret; skipping preload"
          fi

      - name: Validate preloaded VS token
        id: validate_vs
        run: |
          if python tools/ci_validate_token.py --env vs; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

      - name: If VS invalid install browser deps
        if: steps.validate_vs.outputs.valid == 'false'
        run: |
          python -m pip install selenium pyotp webdriver-manager kiteconnect

      - name: If VS invalid run auto-login
        if: steps.validate_vs.outputs.valid == 'false'
        run: python tools/auto_login.py --env vs

      - name: Confirm secrets updated (final)
        run: |
          gh secret list -R $REPO | grep ACCESS_TOKEN_ || true

