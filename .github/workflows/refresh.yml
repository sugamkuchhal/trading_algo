name: refresh
on:
  schedule:
    - cron: "0 19 * * 0-4"  # weekly Mon-Fri at 19:00 UTC (adjust if needed)
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  secrets: write    # needed to update repo secrets

env:
  REPO: sugamkuchhal/trading_algo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      # ---- Preload SARAS token file (from workflow secret) ----
      - name: Preload SARAS token
        run: |
          mkdir -p ~/.config/trading_algo
          echo "$ACCESS_JSON_SARAS" > ~/.config/trading_algo/access_token_saras.json
          chmod 600 ~/.config/trading_algo/access_token_saras.json
        env:
          ACCESS_JSON_SARAS: ${{ secrets.ACCESS_JSON_SARAS }}

      # ---- Validate preloaded SARAS token ----
      - id: saras_validate
        name: Validate preloaded SARAS token
        run: |
          if python tools/ci_validate_token.py --env saras; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

      # If SARAS invalid -> install Chrome (only then)
      - name: Install Google Chrome (only if SARAS validation failed)
        if: steps.saras_validate.outputs.valid == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # If SARAS invalid -> install Selenium & helpers (only then)
      - name: Install Python dependencies (selenium + extras) - SARAS
        if: steps.saras_validate.outputs.valid == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install selenium pyotp webdriver-manager

      # If SARAS invalid -> run auto_login for SARAS (only then)
      - name: Refresh SARAS access token
        if: steps.saras_validate.outputs.valid == 'false'
        run: |
          python tools/auto_login.py --env saras
        env:
          ACCESS_JSON_SARAS: ${{ secrets.ACCESS_JSON_SARAS }}
          ACCESS_TOKEN_GH_PAT_SARAS: ${{ secrets.ACCESS_TOKEN_GH_PAT_SARAS }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CHROME_BIN: /usr/bin/google-chrome-stable

      # ---- Repeat for VS token ----
      - name: Preload VS token
        run: |
          mkdir -p ~/.config/trading_algo
          echo "$ACCESS_JSON_VS" > ~/.config/trading_algo/access_token_vs.json
          chmod 600 ~/.config/trading_algo/access_token_vs.json
        env:
          ACCESS_JSON_VS: ${{ secrets.ACCESS_JSON_VS }}

      - id: vs_validate
        name: Validate preloaded VS token
        run: |
          if python tools/ci_validate_token.py --env vs; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Google Chrome (only if VS validation failed)
        if: steps.vs_validate.outputs.valid == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python dependencies (selenium + extras) - VS
        if: steps.vs_validate.outputs.valid == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install selenium pyotp webdriver-manager

      - name: Refresh VS access token
        if: steps.vs_validate.outputs.valid == 'false'
        run: |
          python tools/auto_login.py --env vs
        env:
          ACCESS_JSON_VS: ${{ secrets.ACCESS_JSON_VS }}
          ACCESS_TOKEN_GH_PAT_VS: ${{ secrets.ACCESS_TOKEN_GH_PAT_VS }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CHROME_BIN: /usr/bin/google-chrome-stable

      # Final: list relevant secrets to confirm updates (non-sensitive output)
      - name: Confirm secrets updated
        run: |
          gh secret list -R $REPO | grep ACCESS_TOKEN_ || true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

