name: refresh-tokens

on:
  schedule:
    # canonical refresh cron (UTC)
    - cron: "0 19 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      REPO: sugamkuchhal/trading_algo
      ALERT_TO: sugamkuchhal@gmail.com
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: sugamkuchhal@gmail.com
      SMTP_TOKEN_JSON_COMMON: ${{ secrets.SMTP_TOKEN_JSON_COMMON }}

      # SARAS creds
      ACCESS_TOKEN_GH_PAT_SARAS: ${{ secrets.ACCESS_TOKEN_GH_PAT_SARAS }}

      # VS creds
      ACCESS_TOKEN_GH_PAT_VS: ${{ secrets.ACCESS_TOKEN_GH_PAT_VS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kiteconnect selenium pyotp webdriver-manager

      - name: Install Google Chrome (official) + chromedriver
        run: |
          set -euo pipefail
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable chromium-chromedriver

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install chromedriver (apt)
        run: |
          sudo apt-get update
          # Install chromium-chromedriver package which provides /usr/bin/chromedriver
          sudo apt-get install -y chromium-chromedriver
          # Ensure chromedriver is on PATH (symlink if package placed elsewhere)
          if ! command -v chromedriver >/dev/null 2>&1; then
            sudo ln -s /usr/lib/chromium-browser/chromedriver /usr/local/bin/chromedriver || true
            sudo ln -s /usr/bin/chromedriver /usr/local/bin/chromedriver || true
          fi


      - name: Refresh SARAS access token
        env:
          ACCESS_JSON_SARAS: ${{ secrets.ACCESS_JSON_SARAS }}
          ACCESS_TOKEN_GH_PAT_SARAS: ${{ secrets.ACCESS_TOKEN_GH_PAT_SARAS }}
        run: |
          set -euo pipefail
          python tools/auto_login.py --env saras

      - name: Refresh VS access token
        env:
          ACCESS_JSON_VS: ${{ secrets.ACCESS_JSON_VS }}
          ACCESS_TOKEN_GH_PAT_VS: ${{ secrets.ACCESS_TOKEN_GH_PAT_VS }}
        run: |
          set -euo pipefail
          python tools/auto_login.py --env vs

      - name: Confirm secrets updated
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN_GH_PAT_SARAS }}
        run: |
          echo "🔎 Checking updated ACCESS_TOKEN_* secrets:"
          gh secret list -R $REPO | grep ACCESS_TOKEN_
