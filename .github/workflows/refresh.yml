name: refresh

on:
  schedule:
    - cron: "0 19 * * 0-4"   # UTC: weekly Mon-Fri at 19:00 UTC (adjust if needed)
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

env:
  REPO: sugamkuchhal/trading_algo
  # any other repo-level envs you want

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      REPO: sugamkuchhal/trading_algo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          # <<< MINIMAL FIX: python version was '3.1' which doesn't exist on Ubuntu 24.04
          python-version: "3.10"
          check-latest: false

      - name: Preload SARAS token
        run: |
          mkdir -p ~/.config/trading_algo
          echo '${{ secrets.ACCESS_TOKEN_SARAS_RAW }}' > ~/.config/trading_algo/access_token_saras.json
          chmod 600 ~/.config/trading_algo/access_token_saras.json

      - name: Install minimal deps (kiteconnect only) - SARAS
        run: |
          python -m pip install --upgrade pip
          pip install kiteconnect

      - id: validate_saras
        name: Validate preloaded SARAS token
        run: |
          # run the validator and write a standard output variable "valid"
          if python tools/ci_validate_token.py --env saras; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Google Chrome (only if SARAS validation failed)
        if: steps.validate_saras.outputs.valid == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python dependencies (selenium + extras) - SARAS
        if: steps.validate_saras.outputs.valid == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install selenium pyotp webdriver-manager

      - name: Refresh SARAS access token
        if: steps.validate_saras.outputs.valid == 'false'
        run: |
          python tools/auto_login.py --env saras

      # ---------- Repeat pattern for VS environment ----------
      - name: Preload VS token
        run: |
          mkdir -p ~/.config/trading_algo
          echo '${{ secrets.ACCESS_TOKEN_VS_RAW }}' > ~/.config/trading_algo/access_token_vs.json
          chmod 600 ~/.config/trading_algo/access_token_vs.json

      - name: Install minimal deps (kiteconnect only) - VS
        run: |
          python -m pip install --upgrade pip
          pip install kiteconnect

      - id: validate_vs
        name: Validate preloaded VS token
        run: |
          if python tools/ci_validate_token.py --env vs; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Google Chrome (only if VS validation failed)
        if: steps.validate_vs.outputs.valid == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python dependencies (selenium + extras) - VS
        if: steps.validate_vs.outputs.valid == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install selenium pyotp webdriver-manager

      - name: Refresh VS access token
        if: steps.validate_vs.outputs.valid == 'false'
        run: |
          python tools/auto_login.py --env vs

      - name: Confirm secrets updated
        run: |
          gh secret list -R $REPO | grep ACCESS_TOKEN_ || true

