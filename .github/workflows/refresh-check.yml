name: refresh-token-check

on:
  schedule:
    - cron: "0 19 * * 0-4"   # Sun-Thu at 19:00 UTC
  workflow_dispatch:

jobs:
  check-tokens:
    runs-on: ubuntu-latest
    env:
      ACCESS_JSON_SARAS: ${{ secrets.ACCESS_JSON_SARAS }}
      ACCESS_TOKEN_SARAS: ${{ secrets.ACCESS_TOKEN_SARAS }}
      ACCESS_JSON_VS: ${{ secrets.ACCESS_JSON_VS }}
      ACCESS_TOKEN_VS: ${{ secrets.ACCESS_TOKEN_VS }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install kiteconnect
        run: pip install kiteconnect

      - name: Run token check script
        run: python tools/check_tokens.py
